<div class="app-container">
  
  @if (shouldShowNavbar()) {
    <app-navbar></app-navbar>
  }

  <main class="main-stage">
    <router-outlet></router-outlet>
  </main>
</div>

@if (shouldShowTabBar()) {
  <app-tabbar></app-tabbar>
}

@if (shop.showAuthPromptModal()) {
  <div class="fixed inset-0 z-[100000] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in modal-overlay"
       style="z-index: 100000 !important;"
       data-modal-overlay
       (click)="shop.closeAuthPrompt()">
    <div 
      class="relative w-full max-w-sm bg-white rounded-[28px] shadow-2xl border border-[rgba(22,100,176,0.22)] p-6 text-center space-y-4 my-auto animate-scale-up"
      (click)="$event.stopPropagation()">
      
      <div class="relative w-16 h-16 mx-auto">
        <img src="assets/icon/app-icon.png" alt="ShopSphere" class="w-16 h-16 rounded-[20px] shadow-md object-cover border border-[rgba(22,100,176,0.15)]" />
        <div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-[#1664b0] text-white flex items-center justify-center shadow-xs border-2 border-white">
          <app-icon name="lock" [size]="12" color="#FFFFFF"></app-icon>
        </div>
      </div>

      <div class="space-y-1.5">
        <h3 class="text-base font-black text-[#1A1D20]">Account Required</h3>
        <p class="text-xs text-[#555B62] leading-relaxed">
          {{ shop.authPromptMessage() || 'Please sign in or create an account to save pieces, add items to your bag, or proceed to checkout.' }}
        </p>
      </div>

      <div class="pt-2 space-y-2">
        <button 
          (click)="shop.goToLoginFromPrompt()"
          class="w-full apple-button-primary py-3 text-xs font-bold shadow-md">
          Sign In or Create Account
        </button>
        <button 
          (click)="shop.closeAuthPrompt()"
          class="w-full text-xs font-bold text-[#555B62] hover:text-[#1A1D20] py-2 transition-colors">
          Continue Browsing
        </button>
      </div>

    </div>
  </div>
}
